services:

  db:
    platform: linux/amd64
    image: postgis/postgis:18-3.6

    restart: unless-stopped

    environment:
      POSTGRES_DB: drishtix
      POSTGRES_USER: drishtix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U drishtix -d drishtix"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - drishtix-network


  ai:
    build:
      context: ./ai-service

    container_name: drishtix-ai

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    networks:
      - drishtix-network


  backend:
    build:
      context: ./backend

    container_name: drishtix-backend

    restart: unless-stopped

    environment:
      NODE_ENV: production

      PORT: 4000

      DATABASE_URL: postgresql://drishtix:${POSTGRES_PASSWORD}@db:5432/drishtix

      AI_SERVICE_URL: http://ai:8000

      CORS_ORIGIN: ${APP_ORIGIN}

      VIEWER_AGENCY_ID: ${VIEWER_AGENCY_ID}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD}

      RESPONDER_AGENCY_ID: ${RESPONDER_AGENCY_ID}
      RESPONDER_PASSWORD: ${RESPONDER_PASSWORD}

      COMMANDER_AGENCY_ID: ${COMMANDER_AGENCY_ID}
      COMMANDER_PASSWORD: ${COMMANDER_PASSWORD}

      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}

    volumes:
      - backend_uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

      ai:
        condition: service_healthy

    networks:
      - drishtix-network


  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_BASE_URL: ${APP_ORIGIN}/api/v1
        VITE_BACKEND_ORIGIN: ${APP_ORIGIN}

    container_name: drishtix-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - drishtix-network


volumes:

  postgres_data:

  backend_uploads:


networks:

  drishtix-network:

    driver: bridge